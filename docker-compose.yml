services:
  db:
    image: mariadb:11
    container_name: devops-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
      MARIADB_DATABASE: devops_db
      MARIADB_USER: devuser
      MARIADB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  api:
    image: ${DOCKERHUB_USERNAME}/python-devops-project:${IMAGE_TAG}
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=devuser
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=devops_db
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  mariadb_data:
  
