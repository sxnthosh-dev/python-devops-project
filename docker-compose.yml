services:
  db:
    image: mariadb:11
    container_name: devops-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: devops_db
      MARIADB_USER: devuser
      MARIADB_PASSWORD: devpassword
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  api:
    build: .
    container_name: devops-api
    env_file:
      - .env
    depends_on:
      - db
    ports:
      - "8000:8000"

volumes:
  mariadb_data:
  
