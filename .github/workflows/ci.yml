name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: rootpassword
          MARIADB_DATABASE: devops_db
          MARIADB_USER: devuser
          MARIADB_PASSWORD: devpassword
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for MariaDB
        run: |
          for i in {1..30}; do
            if python -c "import pymysql; pymysql.connect(host='127.0.0.1', port=3307, user='devuser', password='devpassword', database='devops_db')" 2>/dev/null; then
              echo "MariaDB is ready"
              break
            fi
            echo "Waiting for MariaDB..."
            sleep 2
          done

      - name: Run migrations
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3307
          DB_USER: devuser
          DB_PASSWORD: devpassword
          DB_NAME: devops_db
        run: |
          alembic upgrade head

      - name: Run tests
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: 3307
          DB_USER: devuser
          DB_PASSWORD: devpassword
          DB_NAME: devops_db
        run: |
          python -m pytest -v

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/python-devops-project:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/python-devops-project:${{ github.sha }}
  deploy:
    needs: test
    runs-on: self-hosted

    steps:
      - name: Deploy application
        run: |
          cd /home/noble_numbat/python-devops-project
         
          export IMAGE_TAG=${{ github.sha }}

          docker compose pull
          docker compose up -d

          echo "Running database migrations..."
          docker compose exec -T api alembic upgrade head

      - name: Verify deployment
        run: |
          cd /home/noble_numbat/python-devops-project

          for i in {1..30}; do
            if curl --fail http://localhost:8000/health; then
              echo "API is ready"
              break
            fi

            echo "Waiting for API..."
            sleep 2
          done

          curl --fail http://localhost:8000/users
          curl --fail http://localhost:8000/version