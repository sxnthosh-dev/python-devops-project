name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  validate:
    name: Validate Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Validate Docker Compose
        run: |
          docker compose config

  deploy:
    name: Deploy Kimai
    needs: validate

    # Deploy only after a push to main.
    # Pull requests only run validation.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: self-hosted

    steps:

      - name: Update repository
        run: |
          cd /home/noble_numbat/python-devops-project

          git fetch origin main
          git reset --hard origin/main

      - name: Pull Docker images
        run: |
          cd /home/noble_numbat/python-devops-project

          docker compose pull

      - name: Start application stack
        run: |
          cd /home/noble_numbat/python-devops-project

          docker compose up -d

      - name: Show container status
        run: |
          cd /home/noble_numbat/python-devops-project

          docker compose ps

      - name: Wait for Kimai
        run: |
          for i in {1..30}; do

            if curl --fail --silent --show-error \
              --location \
              --output /dev/null \
              http://127.0.0.1:8000/en/homepage; then

              echo "Kimai is responding"
              exit 0
            fi

            echo "Waiting for Kimai..."
            sleep 5
          done

          echo "Kimai failed to become ready"
          docker compose ps
          docker compose logs --tail=100 kimai
          exit 1

      - name: Verify Kimai container health
        run: |
          status=$(docker inspect \
            --format='{{.State.Health.Status}}' \
            kimai_app)

          echo "Kimai health status: $status"

          if [ "$status" != "healthy" ]; then
            echo "Kimai container is not healthy"
            docker inspect kimai_app
            exit 1
          fi

      - name: Verify MariaDB health
        run: |
          status=$(docker inspect \
            --format='{{.State.Health.Status}}' \
            devops-mariadb)

          echo "MariaDB health status: $status"

          if [ "$status" != "healthy" ]; then
            echo "MariaDB container is not healthy"
            docker inspect devops-mariadb
            exit 1
          fi

      - name: Verify Prometheus
        run: |
          curl --fail --silent --show-error \
            http://127.0.0.1:9090/-/healthy

          echo
          echo "Prometheus is healthy"

      - name: Verify Grafana
        run: |
          curl --fail --silent --show-error \
            --location \
            --output /dev/null \
            http://127.0.0.1:3000/login

          echo "Grafana is reachable"

      - name: Deployment summary
        run: |
          cd /home/noble_numbat/python-devops-project

          echo "======================================"
          echo "Kimai deployment completed successfully"
          echo "======================================"

          docker compose ps